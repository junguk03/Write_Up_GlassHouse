# 문제 서버를 띄웁니다.
#
#   cp .env.example .env     # 실제 플래그를 적습니다 (출제 조만)
#   docker compose up --build
#
# 접속: http://localhost:8000
# 같은 와이파이의 다른 노트북에서는 http://<출제조IP>:8000

services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      # 같은 폴더의 .env 를 자동으로 읽습니다.
      # .env 가 없으면 뒤의 기본값이 쓰여 앱이 죽지 않습니다.
      - FLAG_ADMIN=${FLAG_ADMIN:-FLAG_NOT_SET}
      - SECRET_KEY=${SECRET_KEY:-change-me-per-challenge}
    restart: unless-stopped
