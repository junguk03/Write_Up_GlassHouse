# 서버를 도커로 띄웁니다.
#
#   docker compose up --build -d     켜기 (백그라운드)
#   docker compose down              끄기
#
# 접속: http://localhost:8006
# 같은 와이파이의 다른 노트북에서는 http://<내IP>:8006

services:
  web:
    build: .
    ports:
      - "8006:8006"
    # 같은 폴더의 .env 를 통째로 컨테이너에 넘깁니다.
    # 변수 이름을 바꾸거나 추가해도 이 파일은 고칠 필요가 없습니다.
    env_file: .env
    restart: unless-stopped
    # 명령 실행이 되는 문제라 컨테이너를 잠급니다.
    # 파일은 못 바꾸고(재시작하면 처음 상태), 서버 자원은 이 안에서만 씁니다.
    read_only: true
    tmpfs:
      - /tmp
    user: "1000:1000"
    mem_limit: 256m
    cpus: "0.5"
    pids_limit: 64
