services:
  web:
    build: .
    ports:
      - "8013:8013"
    env_file: .env
    restart: unless-stopped
    # 공용 서버라 컨테이너를 잠급니다. 파일은 못 바꾸고(재시작하면 처음 상태), 자원은 이 안에서만 씁니다.
    read_only: true
    tmpfs:
      - /tmp
      - /srv/uploads:mode=1777
    user: "1000:1000"
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    mem_limit: 256m
    cpus: "0.5"
    pids_limit: 64
